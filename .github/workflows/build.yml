name: Build packages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  host: x86_64, test: 1 }
          - { arch: aarch64, host: x86_64, test: 0 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare container
        run: |
          set -e
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git rsync openssh

          useradd -G xbuilder -M builder
          echo "builder:100000:65536" > /etc/subuid
          echo "builder:100000:65536" > /etc/subgid

      - name: Clone void-packages
        run: |
          set -e
          git clone --depth 1 https://github.com/void-linux/void-packages.git void-packages
          cd void-packages
          git checkout --detach master

      - name: Merge templates
        run: |
          set -e
          echo "==> Copying templates..."
          cp -rv srcpkgs/* void-packages/srcpkgs/

      - name: Prepare masterdir
        run: |
          set -e
          cd void-packages
          echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Determine changed templates
        id: changed
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          base="${{ github.event.before }}"
          tip="${{ github.sha }}"

          # workflow_dispatch: base пустой → собираем всё
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              changed_pkgs=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | sort | tr '\n' ' ')
              removed_pkgs=""
          else
              changed_pkgs=$(git diff --name-only "$base" "$tip" --diff-filter=AM -- 'srcpkgs/*/template' \
                  | cut -d/ -f2 | sort -u | tr '\n' ' ')
              removed_pkgs=$(git diff --name-status "$base" "$tip" -- 'srcpkgs/*/template' \
                  | awk '$1=="D"{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi

          changed_pkgs="${changed_pkgs%% }"
          removed_pkgs="${removed_pkgs%% }"

          echo "Changed: ${changed_pkgs:-<none>}"
          echo "Removed: ${removed_pkgs:-<none>}"

          echo "pkgs=$changed_pkgs"    >> "$GITHUB_OUTPUT"
          echo "removed=$removed_pkgs" >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}
          HOST: ${{ matrix.host }}
          TEST: ${{ matrix.test }}
        run: |
          set -e
          export PATH="/opt/xbps/usr/bin/:$PATH"

          changed="${{ steps.changed.outputs.pkgs }}"
          echo "Building: ${changed:-<none>} (target=$ARCH, host=$HOST)"

          if [ -z "$changed" ]; then
              echo "Nothing to build."
              exit 0
          fi

          arch_flag=""
          if [ "$ARCH" != "$HOST" ]; then
              arch_flag="-a $ARCH"
          fi

          test_flag=""
          if [ "$TEST" = "1" ]; then
              test_flag="-Q"
          fi

          cd void-packages

          # Разворачиваем зависимости: xbps-src сам подскажет порядок
          PKGS=$(sudo -Eu builder ./xbps-src $test_flag sort-dependencies $changed)
          echo "Build order: $PKGS"

          for pkg in ${PKGS}; do
            echo "==> Building $pkg"
            sudo -Eu builder ./xbps-src -j$(nproc) -s $arch_flag $test_flag pkg "${pkg}"
          done

      - name: Show results
        if: always()
        run: |
          echo "=== binpkgs ==="
          find void-packages/hostdir/binpkgs -maxdepth 2 -type f -name '*.xbps' -printf '%f\n' 2>/dev/null | sort || true

      - name: Upload packages as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: void-packages-${{ matrix.arch }}
          path: void-packages/hostdir/binpkgs/
          if-no-files-found: warn
