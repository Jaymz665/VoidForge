name: Build packages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'srcpkgs/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  host: x86_64, test: 1 }
          - { arch: aarch64, host: x86_64, test: 0 }

    permissions:
      contents: write

    steps:
      - name: Prepare container
        run: |
          set -e
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y sudo bash curl git rsync openssh

          useradd -G xbuilder -M builder
          echo "builder:100000:65536" > /etc/subuid
          echo "builder:100000:65536" > /etc/subgid

          git config --global --add safe.directory '*'

      - name: Checkout repository
        run: |
          set -e
          git clone --single-branch --branch main \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" .
          if [ -n "${{ github.event.before }}" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              git fetch --depth 1 origin "${{ github.event.before }}" 2>/dev/null || true
          fi
          git checkout --detach "${{ github.sha }}"

      - name: Clone void-packages
        run: |
          set -e
          git clone --depth 1 https://github.com/void-linux/void-packages.git void-packages
          cd void-packages
          git checkout --detach master

      - name: Merge templates
        run: |
          set -e
          echo "==> Copying templates..."
          cp -rv srcpkgs/* void-packages/srcpkgs/

      - name: Prepare masterdir
        run: |
          set -e
          cd void-packages
          echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Determine changed templates
        id: changed
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          base="${{ github.event.before }}"
          tip="${{ github.sha }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              changed_pkgs=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | sort | tr '\n' ' ')
              removed_pkgs=""
          else
              changed_pkgs=$(git diff --name-only "$base" "$tip" --diff-filter=AM -- 'srcpkgs/*/template' \
                  | cut -d/ -f2 | sort -u | tr '\n' ' ')
              removed_pkgs=$(git diff --name-status "$base" "$tip" -- 'srcpkgs/*/template' \
                  | awk '$1=="D"{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi

          changed_pkgs="${changed_pkgs%% }"
          removed_pkgs="${removed_pkgs%% }"

          echo "Changed: ${changed_pkgs:-<none>}"
          echo "Removed: ${removed_pkgs:-<none>}"

          echo "pkgs=$changed_pkgs"    >> "$GITHUB_OUTPUT"
          echo "removed=$removed_pkgs" >> "$GITHUB_OUTPUT"

      - name: Build packages
        id: build_step
        env:
          ARCH: ${{ matrix.arch }}
          HOST: ${{ matrix.host }}
          TEST: ${{ matrix.test }}
        run: |
          set -e
          export PATH="/opt/xbps/usr/bin/:$PATH"

          changed="${{ steps.changed.outputs.pkgs }}"
          echo "Building: ${changed:-<none>} (target=$ARCH, host=$HOST)"

          if [ -z "$changed" ]; then
              echo "Nothing to build."
              echo "built=" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          arch_flag=""
          if [ "$ARCH" != "$HOST" ]; then
              arch_flag="-a $ARCH"
          fi

          test_flag=""
          if [ "$TEST" = "1" ]; then
              test_flag="-Q"
          fi

          cd void-packages

          PKGS=$(sudo -Eu builder ./xbps-src $test_flag sort-dependencies $changed)
          echo "Build order: $PKGS"

          built=""
          for pkg in ${PKGS}; do
            echo "==> Building $pkg"
            sudo -Eu builder ./xbps-src -j$(nproc) -s $arch_flag $test_flag pkg "${pkg}"
            built="$built $pkg"
          done
          built="${built%% }"
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Show results
        if: always()
        run: |
          echo "=== binpkgs ==="
          find void-packages/hostdir/binpkgs -maxdepth 2 -type f -name '*.xbps' -printf '%f\n' 2>/dev/null | sort || true

      - name: Upload packages as artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: void-packages-${{ matrix.arch }}
          path: void-packages/hostdir/binpkgs/
          if-no-files-found: warn

      - name: Index and Deploy to GitHub Pages
        if: success() && steps.build_step.outputs.built != ''
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          export PATH="/opt/xbps/usr/bin/:$PATH"
          export XBPS_ARCH="${ARCH}"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          pkgs=( void-packages/hostdir/binpkgs/*."${ARCH}".xbps )
          if [ ${#pkgs[@]} -eq 0 ]; then
              echo "No packages for ${ARCH}, nothing to deploy."
              exit 0
          fi
          echo "Found ${#pkgs[@]} package(s) for ${ARCH}"

          rm -rf deploy
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" deploy

          mkdir -p "deploy/${ARCH}"
          cp -v "${pkgs[@]}" "deploy/${ARCH}/"

          cd "deploy/${ARCH}"
          rm -f *-repodata *-repodata.sig

          xbps-rindex --arch "${ARCH}" -f -a *.xbps
          xbps-rindex --arch "${ARCH}" -c .

          echo "=== ${ARCH} directory ==="
          ls -la
          cd ..

          touch .nojekyll

          git add -f .
          git commit -m "Re-index ${ARCH}: ${{ github.sha }}" || echo "No changes to commit"

          for i in 1 2 3 4 5; do
              if git push origin gh-pages; then
                  echo "Pushed successfully."
                  break
              fi
              echo "Push failed, retrying after pull --rebase..."
              git pull --rebase origin gh-pages
          done
